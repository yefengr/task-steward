packages:
  - apps/*
  - packages/*

catalog:
  '@types/node': 24.19.2
  eslint: 9.39.5
  typescript: 6.0.3
  typescript-eslint: 8.59.3
  vitest: 4.1.12
  zod: 4.6.6

catalogs:
  pwa:
    typescript: 5.9.3

# Pi SDK 只提供开发时类型，运行时使用本机 Pi 自带的依赖。
allowBuilds:
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@yefengr/pwa-foundation@0.0.1'
  - '@yefengr/pwa-foundation@0.0.2'
  - '@yefengr/pwa-foundation@0.0.3'
  - '@yefengr/pwa-foundation@0.0.4'

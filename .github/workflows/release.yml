name: Pack and publish Task Steward

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: steward-npm
  cancel-in-progress: false

jobs:
  pack:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - name: Verify and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm verify
          pnpm pack:stew "$RUNNER_TEMP/steward-npm"
      - uses: actions/upload-artifact@v7
        with:
          name: steward-npm-package
          path: ${{ runner.temp }}/steward-npm
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push' && github.repository == 'yefengr/task-steward'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          # 使用支持 npm OIDC 发布的 Node 和 npm 版本。
          node-version: 24.22.3
      - uses: actions/download-artifact@v8
        with:
          name: steward-npm-package
          path: ${{ runner.temp }}/steward-npm
      - name: Publish new version to npm
        shell: bash
        run: |
          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/steward-npm/yefengr-steward-*.tgz)
          [[ ${#bundles[@]} == 1 ]]
          bundle=${bundles[0]}
          manifest=$(tar -xOzf "$bundle" package/package.json)
          version=$(jq -er 'select(.name == "@yefengr/steward") | .version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$manifest")
          [[ "$(basename "$bundle")" == "yefengr-steward-$version.tgz" ]]
          registry=https://registry.npmjs.org
          status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$registry/@yefengr%2fsteward/$version")
          case "$status" in
            200) echo "@yefengr/steward@$version is already published." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            404) ;;
            *) echo "Could not check the npm version (HTTP $status)." >&2; exit 1 ;;
          esac
          latest=$(curl -fsS --max-time 15 "$registry/@yefengr%2fsteward/latest" | jq -er '.version')
          if ! jq -en --arg version "$version" --arg latest "$latest" '
            def numbers: split(".") | map(tonumber);
            ($version | numbers) > ($latest | numbers)
          ' >/dev/null; then
            echo "Version $version must be newer than npm latest ($latest)." >&2
            exit 1
          fi
          npm publish "$bundle" --access public --registry="$registry"
          echo "@yefengr/steward@$version published to npm." >> "$GITHUB_STEP_SUMMARY"

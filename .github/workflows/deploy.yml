name: Deploy Steward platform

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: steward-platform-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Build and export the production image
        env:
          IMAGE: pi-steward-platform:sha-${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -f docker/platform.Dockerfile -t "$IMAGE" .
          mkdir "$RUNNER_TEMP/steward-image"
          docker image inspect --format '{{.Id}}' "$IMAGE" > "$RUNNER_TEMP/steward-image/image-id"
          docker image save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/steward-image/platform.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: steward-platform-image
          path: ${{ runner.temp }}/steward-image
          if-no-files-found: error
          retention-days: 3

  production:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://steward.yefengr.cn
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: steward-platform-image
          path: ${{ runner.temp }}/steward-image
      - name: Deploy and check HTTPS
        env:
          IMAGE: pi-steward-platform:sha-${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/steward-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          remote=(ssh -i "$ssh_dir/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes
            -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST")
          bundle="$RUNNER_TEMP/steward-image"
          image_id=$(<"$bundle/image-id")
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          "${remote[@]}" 'docker image load --quiet' < "$bundle/platform.tar.gz"
          "${remote[@]}" "bash -s -- '$IMAGE' '$image_id'" < scripts/deploy-platform.sh
          curl --retry 3 -fsS --max-time 10 https://steward.yefengr.cn/health | jq -e '.ok == true'
          curl -fsS --max-time 10 -o "$RUNNER_TEMP/steward-pair.html" https://steward.yefengr.cn/pair
          grep -q 'Pi Steward' "$RUNNER_TEMP/steward-pair.html"

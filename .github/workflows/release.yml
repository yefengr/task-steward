name: Pack and stage Task Steward

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Submit the verified package to npm for 2FA approval (unchecked only verifies and packs)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pack_required: ${{ steps.version.outputs.pack_required }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'This workflow can only run on main.' >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether to build the macOS package
        id: version
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/npm-release.sh preflight

  verify:
    needs: preflight
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.preflight.result == 'failure' || needs.preflight.outputs.pack_required == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - name: Verify
        run: |
          bash scripts/test-npm-release.sh
          pnpm install --frozen-lockfile
          pnpm verify

  pack:
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.pack_required == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.inspect.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - name: Verify and pack
        run: |
          bash scripts/test-npm-release.sh
          pnpm install --frozen-lockfile
          pnpm verify
          node scripts/pack-stew.mjs "$RUNNER_TEMP/steward-npm"
      - name: Inspect the npm tarball
        id: inspect
        run: bash scripts/npm-release.sh inspect "$RUNNER_TEMP/steward-npm"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: steward-npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steward-npm
          if-no-files-found: error
          retention-days: 3

  stage:
    needs: [preflight, pack]
    if: github.repository == 'yefengr/task-steward' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stage))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Do not let unrelated pushes cancel pending release runs.
    concurrency:
      group: steward-npm-stage-${{ needs.preflight.outputs.version }}
      cancel-in-progress: false
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # The bundled npm must support npm stage publish (>= 11.15.0).
          node-version: 24.22.3
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/steward-npm
      - name: Submit the verified package to npm Staged Packages
        env:
          STAGE_REQUESTED: ${{ inputs.stage }}
          STEWARD_NPM_HOLD_VERSION: ${{ vars.STEWARD_NPM_HOLD_VERSION }}
          PACKAGE_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: bash scripts/npm-release.sh stage "$RUNNER_TEMP/steward-npm" "$PACKAGE_SHA256"
